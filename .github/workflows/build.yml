name: Build APK

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '要转换的网页地址，例如 https://example.com'
        required: false
        default: 'https://example.com'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # 在临时目录生成 Gradle Wrapper，再复制进 android/，
      # 避免仓库里提交二进制 gradle-wrapper.jar。
      - name: Generate Gradle Wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/gw"
          cd "$RUNNER_TEMP/gw"
          echo "rootProject.name = 'wrapper-gen'" > settings.gradle
          gradle wrapper --gradle-version 8.4
          cp -r gradlew gradlew.bat gradle "$GITHUB_WORKSPACE/android/"

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --dart-define=APP_URL="${{ github.event.inputs.target_url }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webwrap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk