name: Build APK

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '要转换的网页地址，例如 https://example.com'
        required: false
        default: 'https://example.com'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        run: |
          git clone --quiet --depth 1 --branch "${{ github.ref_name }}" "https://github.com/${{ github.repository }}" "$RUNNER_TEMP/repo"
          cp -a "$RUNNER_TEMP/repo/." .
          rm -rf "$RUNNER_TEMP/repo"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.4'

      - name: Configure Flutter
        run: |
          flutter config --no-analytics >/dev/null 2>&1 || true
          flutter config --no-cli-animations >/dev/null 2>&1 || true

      - name: Resolve Dependencies
        run: flutter pub get >/dev/null 2>&1

      - name: Generate Android Scaffold
        run: flutter create --platforms=android --org com.example --project-name webwrap . >/dev/null 2>&1

      - name: Enable Gradle Optimizations
        run: |
          printf 'org.gradle.parallel=true\norg.gradle.caching=true\n' >> android/gradle.properties

      - name: Build Release APK
        run: |
          flutter build apk --release --dart-define=APP_URL="${{ github.event.inputs.target_url }}" >/tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -200 /tmp/build.log >&2
            exit $code
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: webwrap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk