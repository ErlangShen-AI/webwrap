name: Build APK

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '要转换的网页地址，例如 https://example.com'
        required: false
        default: 'https://example.com'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      # 用 flutter create 生成与当前 Flutter SDK 完全匹配的 Android 工程脚手架
      # （settings.gradle.kts / build.gradle.kts / gradlew 等），
      # 避免手写 Gradle 文件与 SDK 版本不匹配。
      - name: Generate Android Scaffold
        run: flutter create --platforms=android --org com.example --project-name webwrap .

      - name: Build Release APK
        run: flutter build apk --release --dart-define=APP_URL="${{ github.event.inputs.target_url }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webwrap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk